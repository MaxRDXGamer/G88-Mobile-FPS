
name: Build G88 Mobile FPS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Extract source ZIP
        run: unzip -o G88FPS-Source.zip -d source

      - name: Fix Fabric Loom repository mode
        run: sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/' source/G88-Mobile-FPS/settings.gradle
        
      - name: Build mod
        working-directory: source/G88-Mobile-FPS
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G88-Mobile-FPS-build
          path: source/G88-Mobile-FPS/build/libs/*.jar
  
